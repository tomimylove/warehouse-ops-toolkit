[build]
  # Generates the Prisma client, builds the web app, and compiles apps/api
  # with its own tsc (nest build) — the netlify function requires that
  # compiled output rather than the TS source (see netlify/functions/api.ts
  # for why: esbuild can't do emitDecoratorMetadata, which Nest's DI needs).
  # Netlify installs root deps automatically beforehand.
  command = "npx prisma generate --schema=prisma/schema.prisma && npm run build:web && npm run build:api"
  publish = "apps/web/dist"

[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/.prisma/**", "node_modules/@prisma/**"]
  # @nestjs/core optionally requires these at runtime (microservices
  # transports, websockets gateways, cache-manager) and catches the
  # MODULE_NOT_FOUND itself when they're absent — we use none of them (plain
  # HTTP only). esbuild doesn't know that and fails the build trying to
  # statically resolve them, so they're excluded from bundling here.
  external_node_modules = [
    "@nestjs/microservices",
    "@nestjs/websockets",
    "@nestjs/websockets/socket-module",
    "cache-manager",
    "class-transformer/storage",
  ]

# Frontend calls /api/<entity> (see apps/web VITE_API_BASE_URL); this
# forwards it to the NestJS app running in a Netlify Function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback so client-side routes (React Router) survive a hard refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
