services:
  # NestJS API as a normal long-running Node process — no esbuild/serverless-http
  # workarounds needed here, unlike the Netlify Function this replaces.
  - type: web
    name: warehouse-ops-api
    runtime: node
    plan: free
    # Was frankfurt — the Supabase database lives in ap-northeast-1
    # (Tokyo), so every query paid a Frankfurt<->Tokyo round trip on top
    # of Render's own free-plan cold start. Singapore is the closest
    # Render region to Tokyo (Render has no Japan region) and cuts that
    # cross-continental hop way down. Region is fixed at creation — a
    # Blueprint sync of this file will NOT move the existing service;
    # applying this for real means standing up a new Render service in
    # Singapore and retiring the Frankfurt one (see deploy notes).
    region: singapore
    buildCommand: npm install && npx prisma generate --schema=prisma/schema.prisma && npm run build:api
    startCommand: node apps/api/dist/main.js
    # Skip rebuilding this service for pushes that only touch the frontend
    # — prisma/ and root config stay watched since both services depend
    # on them (schema changes, lockfile, render.yaml itself).
    buildFilter:
      ignoredPaths:
        - apps/web/**
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

  # Vite build, served as a static site with SPA fallback.
  - type: web
    name: warehouse-ops-web
    runtime: static
    buildCommand: npm install && npm run build:web
    staticPublishPath: apps/web/dist
    # Skip rebuilding this service for pushes that only touch the backend.
    buildFilter:
      ignoredPaths:
        - apps/api/**
    envVars:
      # Placeholder — Render assigns the api service's real hostname on
      # first deploy; update this to match (Usage & billing -> the api
      # service's URL) and trigger a rebuild if it differs.
      - key: VITE_API_BASE_URL
        value: https://warehouse-ops-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
